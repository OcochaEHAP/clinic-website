<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Clinic</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(to right, #e0f7fa, #f1f8e9);
      color: #333;
    }

    .container {
      text-align: center;
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #00796b;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #004d40;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #555;
    }

    .notify {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .notify input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      flex: 1;
      min-width: 0;
    }

    .notify button {
      background: #00796b;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .notify button:hover {
      background: #004d40;
    }

    .footer {
      margin-top: 25px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">khalil clinique</div>
    <h1>We're Coming Soon</h1>
    <p>Our new medical website is under construction. Stay tuned for updates and healthy news!</p>


    <div class="footer">
      &copy; 2025 khalil clinique. All rights reserved.
    </div>
  </div>
</body>

</html>
